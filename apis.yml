aid: blocto
name: Blocto
description: >-
  Blocto is a Web3 smart-contract wallet built by Portto that lets everyday users
  interact with decentralized applications without managing seed phrases, using a
  chain-agnostic account-abstraction architecture. For developers, Blocto ships a
  client-side integration surface — the JavaScript Blocto SDK, a Blocto-flavored
  Flow Client Library (FCL) fork, plus Go, Swift and Rust SDKs — to connect dApps
  to the Blocto wallet for authentication, transaction signing and account-proof
  verification across Flow, Ethereum, Solana, Aptos, Polygon, BNB Chain, Avalanche,
  Arbitrum and Optimism. Surfaced as a 500 Global portfolio company and enriched
  into the API Evangelist network from its public developer documentation and
  GitHub organization.
